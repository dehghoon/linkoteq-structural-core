name: Contract governance
on:
  push:
    paths:
      - 'releases/compatibility-manifest.json'
      - 'scripts/validate_compatibility_manifest.py'
      - '.github/workflows/contract-governance.yml'
  pull_request:
    paths:
      - 'releases/compatibility-manifest.json'
      - 'scripts/validate_compatibility_manifest.py'
      - '.github/workflows/contract-governance.yml'
jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_compatibility_manifest.py
